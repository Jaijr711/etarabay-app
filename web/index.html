<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="E-Tarabay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>E-Tarabay</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  
  
  
  
  
  
  
  
  <style id="splash-screen-style">
    /* The games are laid out to fit the screen exactly, so nothing inside the
       app scrolls. What was left was the browser's own page scroll: on a phone
       a drag still rubber-banded the whole canvas and could trigger
       pull-to-refresh, which reads as the board sliding away under your
       finger. There is nothing to scroll to, so switch it off. */
    html, body {
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
    }

    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  
  
  
  
  
  <div id="android-only"
       style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:32px;background:#FFFFFF;text-align:center;font:18px/1.5 system-ui,-apple-system,sans-serif;color:#1F2340;">
    <div>
      <strong>Para sa Android lamang ang <span style="white-space:nowrap">E-Tarabay</span>.</strong><br>
      Hindi ito magagamit sa iPhone o iPad.<br><br>
      <span style="white-space:nowrap">E-Tarabay</span> is available on Android only.
    </div>
  </div>
  <script>
    // Android only (2026-10-13): on an iPhone or iPad — in Safari or added to
    // the home screen — the app is not loaded, only the note above is shown.
    // iPadOS reports itself as a Mac; a Mac has no touch screen.
    (function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      if (isIOS) {
        var splash = document.getElementById('splash');
        if (splash) splash.remove();
        document.getElementById('android-only').style.display = 'flex';
        return;
      }
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>


</body></html>
